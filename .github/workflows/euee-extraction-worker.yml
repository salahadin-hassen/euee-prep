name: EUEE extraction worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional: specific job ID to process (empty = claim next)"
        required: false
        type: string
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: euee-extraction-worker
  cancel-in-progress: false

jobs:
  process-one-job:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out worker code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: tools/content_pipeline/requirements-ai.txt
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check -r tools/content_pipeline/requirements-ai.txt
      - name: Process one queued extraction job
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          WORKER_CONTROL_URL: ${{ secrets.WORKER_CONTROL_URL }}
          WORKER_SHARED_SECRET: ${{ secrets.WORKER_SHARED_SECRET }}
          WORKER_ID: github-actions-${{ github.run_id }}
          WORKER_JOB_ID: ${{ inputs.job_id }}
        run: python tools/content_pipeline/providers/github_actions_worker.py
